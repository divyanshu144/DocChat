name: CI

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
  workflow_call: # reused by deploy.yml so a deploy can never skip the checks
    inputs:
      export_images:
        description: Keep the scanned images as artifacts so the deploy pushes exactly what was scanned
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned tool images; bump deliberately (Dependabot proposes the update).
  TERRAFORM_IMAGE: hashicorp/terraform:1.9
  TRIVY_IMAGE: aquasec/trivy:0.76.1
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1

jobs:
  python:
    name: Lint, tests, dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install the exact dependency set the images ship, plus test tools
        run: |
          python -m pip install --no-deps -r requirements.lock
          grep -iE '^(pytest|pytest-asyncio|aiosqlite|ruff)([=<>~ ]|$)' requirements.txt | sed 's/ *#.*//' > "$RUNNER_TEMP/dev-requirements.txt"
          echo pip-audit >> "$RUNNER_TEMP/dev-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/dev-requirements.txt"
      - run: ruff check .
      - name: Tests (no AWS credentials, no network services)
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
        run: pytest -m "not eval" -q
      - name: Audit locked dependencies
        # Both ignores are accepted on purpose; see docs/aws/security.md ("Accepted dependency advisories").
        #   PYSEC-2026-1325  ecdsa: timing attack on ECDSA *signing*; the app only uses HS256.
        #   PYSEC-2026-4298  python-jose: key-type confusion when algorithms are unrestricted; the app pins algorithms=[...]
        # Neither has a fixed release. Remove these lines when the JWT library is replaced.
        run: >
          pip-audit -r requirements.lock --no-deps --disable-pip
          --ignore-vuln PYSEC-2026-1325 --ignore-vuln PYSEC-2026-4298

  postgres:
    name: Concurrency tests on real PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Throwaway database inside this job only; not a real credential.
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: docchat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci-only-throwaway@127.0.0.1:5432/docchat_test
      REQUIRE_PG: "1" # an unreachable database fails the job instead of skipping the tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install the locked dependencies and test tools
        run: |
          python -m pip install --no-deps -r requirements.lock
          grep -iE '^(pytest|pytest-asyncio|aiosqlite)([=<>~ ]|$)' requirements.txt | sed 's/ *#.*//' > "$RUNNER_TEMP/dev-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/dev-requirements.txt"
      - name: Advisory locks, row claims, DDL races, lease versus redelivery, password rotation
        run: pytest -m pg -q

  images:
    name: Build and scan (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build --file docker/Dockerfile --target "${{ matrix.target }}" --tag "docchat-${{ matrix.target }}:ci" .
      - name: Runs read-only, non-root, offline, and embeds text from the baked model
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python "docchat-${{ matrix.target }}:ci" -c \
            "import os, app.main, app.worker.loop; from app.services.embedder import get_embedder; assert os.getuid() != 0; assert len(get_embedder().embed_query('x')) == 384"
      - name: Vulnerability scan (fixable HIGH and CRITICAL fail the build)
        run: |
          docker save --output image.tar "docchat-${{ matrix.target }}:ci"
          docker run --rm -v "$PWD:/scan" -v trivy-cache:/root/.cache "$TRIVY_IMAGE" image \
            --input /scan/image.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      - name: Record the scanned image id
        if: inputs.export_images
        run: docker image inspect --format '{{.Id}}' "docchat-${{ matrix.target }}:ci" > image.id
      - name: Keep the scanned image for the deploy job
        if: inputs.export_images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.target }}
          path: |
            image.tar
            image.id
          retention-days: 1
          compression-level: 1

  terraform:
    name: Terraform fmt, validate, scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: fmt
        run: docker run --rm -v "$PWD/infra/terraform:/tf" -w /tf "$TERRAFORM_IMAGE" fmt -check -recursive -diff
      - name: init (no backend, no credentials) and validate
        run: |
          docker run --rm -v "$PWD/infra/terraform:/tf" -w /tf "$TERRAFORM_IMAGE" init -backend=false -input=false
          docker run --rm -v "$PWD/infra/terraform:/tf" -w /tf "$TERRAFORM_IMAGE" validate
      - name: Misconfiguration scan (HIGH and CRITICAL fail the build)
        run: docker run --rm -v "$PWD/infra/terraform:/work:ro" "$TRIVY_IMAGE" config --severity HIGH,CRITICAL --exit-code 1 /work

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git /repo --no-banner --redact --exit-code 1 --config /repo/.gitleaks.toml
