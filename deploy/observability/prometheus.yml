# Example only. Run on the same private network as DocChat and edit vLLM's target.
global:
  scrape_interval: 5s
scrape_configs:
  - job_name: docchat
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["app:8000"]
    # If METRICS_BEARER_TOKEN is configured, mount a matching raw-token file:
    # authorization:
    #   type: Bearer
    #   credentials_file: /run/secrets/docchat_metrics_token
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm:8000"]
    # Verify the pinned server's metrics authentication/network configuration.
